qiling_xrobotoolkit_pxrea_adapter_real:
  ros__parameters:
    publish_rate_hz: 90.0
    left_pose_topic: "/xr/left_controller_pose"
    right_pose_topic: "/xr/right_controller_pose"
    joy_topic: "/xr/controller_joy"
    input_frame: "xr_origin"
    grip_button_threshold: 0.50
    # buttons[0]/[1] are left X/right A; buttons[2]/[3] are left Y/right B.
    frame_timeout_sec: 0.20
    # PXREA can report a server reconnect while its per-client state stream
    # remains stopped. Stop this client and let the ROS launch process spawn
    # a fresh PXREA client; do not Deinit/Init the SDK in one process.
    sdk_recovery_enabled: true
    sdk_recovery_delay_sec: 0.50
    sdk_state_watchdog_timeout_sec: 1.00
