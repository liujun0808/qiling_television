d435_camera_publisher:
  ros__parameters:
    # MuJoCo scene XML路径。支持绝对路径、相对路径和package://包名/相对路径。
    # 需要与 mujoco_simulator 当前仿真场景保持一致，否则 /mujoco/qpos 长度会不匹配。
    model_path: "package://qi_robot_description/new_scene/scene_S4_40DOF_fullbody.xml"

    # MuJoCo模型中的固定相机名称。
    camera_name: "d435_camera"

    # ROS图像参数。
    frame_id: "d435_camera"
    # 与 foundationpose_yolo_ros 默认订阅话题保持一致。
    image_topic: "/camera/camera/color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    # 第一阶段只有头部 RGB 相机，先关闭深度以降低渲染和传输开销。
    enable_depth: false
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    width: 640
    height: 480
    fps: 30.0

    # 主 MuJoCo 仿真发布的完整 qpos。收到后，相机使用同一状态渲染而非停留在 home。
    qpos_topic: "/mujoco/qpos"

    # 在收到第一帧 qpos 前，是否先加载 home keyframe。
    reset_to_home: true
    reset_keyframe: "teleop_start"
